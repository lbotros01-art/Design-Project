<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gallery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img class="logo" src="sushi.png" alt="Sushi Haven logo">
        <h1>Sushi Haven</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="topnav">
            <input type="text" placeholder="Search..">
        </div>
    </header>

    <div class="container">
        <main>
            <section>
                <h2>Gallery</h2>
                <p style="text-align: center; color: #666;">.</p>
                <div class="gallery-grid">
                    <div class="gallery-item">
                        <img src="dragon.png" alt="Dragon Roll">
                    </div>
                    <div class="gallery-item">
                        <img src="nigiri.png" alt="Premium Nigiri">
                    </div>
                    <div class="gallery-item">
                        <img src="shasimi.png" alt="Sashimi Platter">
                    </div>
                    <div class="gallery-item">
                        <img src="assorted.png" alt="Assorted Rolls">
                    </div>
                    <div class="gallery-item">
                        <img src="bentobox.png" alt="Bento Box">
                    </div>
                    <div class="gallery-item">
                        <img src="platter.png" alt="Beautiful Platter">
                    </div>
                    <div class="gallery-item">
                        <img src="special.png" alt="Special Dish">
                    </div>
                    <div class="gallery-item">
                        <img src="exterior.png" alt="Restaurant Exterior">
                    </div>
                    <div class="gallery-item">
                        <img src="chef.png" alt="Our Chef">
                    </div>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
