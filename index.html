<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sushi Haven</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img class="logo" src="sushi.png" alt="Sushi Haven logo">
        <h1>Sushi Haven</h1>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="topnav">
            <input type="text" placeholder="Search.." id="sbar">
        </div>
    </header>
   <!--Youtube-->
    <div class="container">
        <main>
            <section>
                <h2>Sushi Gallery</h2>
                <div class="slideshow-container">
                    <div class="slide fade">
                        <img src="slideimage1.png" alt="Delicious sushi set">
                    </div>
                    <div class="slide fade">
                        <img src="dragon.png" alt="Dragon roll">
                    </div>
                    <div class="slide fade">
                        <img src="boat.png" alt="Nigiri pieces">
                    </div>
                </div>
                <div class="dots-container">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </section>

            <section>
                <h2>Specialties</h2>
                <div class="featured-items">
                    <div class="item">
                        <img src="dragon.png" alt="Dragon Roll">
                        <h3>Dragon Roll</h3>
                        <p>roll with avocado, cucumber, and fresh tuna.</p>
                    </div>
                    <div class="item">
                        <img src="nigiri.png" alt="Premium Nigiri">
                        <h3>Fresh Nigiri</h3>
                        <p></p>
                    </div>
                    <div class="item">
                        <img src="shasimi.png" alt="Sashimi Platter">
                        <h3>Sashimi Platter</h3>
                        <p></p>
                    </div>
                </div>
            </section>
        </main>
    </div>
<!--I had help with the format with Ai-->
    <script>
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');

        function showSlides() {
            slides.forEach((slide) => slide.style.display = 'none');
            dots.forEach((dot) => dot.classList.remove('active'));
            slideIndex++;
            if (slideIndex > slides.length) {
                slideIndex = 1;
            }
            slides[slideIndex - 1].style.display = 'block';
            dots[slideIndex - 1].classList.add('active');
            setTimeout(showSlides, 3000);
        }

        if (slides.length) {
            showSlides();
        }
    </script>
</body>
</html>
